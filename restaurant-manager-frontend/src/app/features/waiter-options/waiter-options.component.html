<div class="flex h-screen w-full bg-amber-700 overflow-hidden">

  <aside class="w-72 h-full bg-zinc-900 border-r border-zinc-800 flex flex-col shrink-0 shadow-2xl">
    <div class="p-6 border-b border-zinc-800">
      <h2 class="text-white font-bold text-xs uppercase tracking-[0.2em] opacity-50">
        Orden: #842
      </h2>
    </div>

    <div class="flex-1 overflow-y-auto p-4 space-y-3">
      <div
        class="h-full border-2 border-dashed border-zinc-800 rounded-3xl flex items-center justify-center text-center px-4">
        <span class="text-zinc-700 text-xs italic tracking-widest uppercase">
          Productos seleccionados
        </span>
      </div>
    </div>

    <div class="p-4 bg-zinc-900 border-t border-zinc-800">
      <div class="py-3 px-4 mb-3 flex justify-between items-center text-white font-bold border-b border-zinc-800">
        <span class="text-xs uppercase opacity-50">Total</span>
        <span class="text-xl">0.00€</span>
      </div>
      <button
        class="w-full py-4 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-bold transition-all uppercase text-xs tracking-widest shadow-lg">
        Confirmar
      </button>
    </div>
  </aside>


  <main class="flex-1 h-full flex flex-col items-center justify-center overflow-y-auto p-6">

    <div class="text-white/20 font-black text-6xl uppercase tracking-widest pointer-events-none select-none">
      Sala
    </div>

    <a [routerLink]="['/sala']">Volver a Sala</a>

  </main>


  <aside class="w-72 h-full bg-zinc-900 border-l border-zinc-800 flex flex-col shrink-0 shadow-2xl">
    <div class="p-6 border-b border-zinc-800">
      <h2 class="text-white font-bold text-xs uppercase tracking-[0.2em] opacity-50">
        Familias
      </h2>
    </div>

    <div class="flex-1 overflow-y-auto p-4 space-y-3">
      <div
        class="h-full border-2 border-dashed border-zinc-800 rounded-3xl flex items-center justify-center text-center px-4">
        <span class="text-zinc-700 text-xs italic tracking-widest uppercase">
          Menú de Categorías
        </span>
      </div>
    </div>

    <div class="p-4 bg-zinc-900 border-t border-zinc-800">
      <div class="py-2 px-4 rounded-lg bg-zinc-800/50 text-[10px] text-zinc-500 text-center uppercase font-medium">
        Selección de productos
      </div>
    </div>
  </aside>

</div>
