<aside [class]="isOpen ? 'w-80' : 'w-12'"
  class="relative h-screen bg-zinc-900 border-l border-zinc-800 transition-all duration-300 ease-in-out flex flex-col shrink-0">

  <button (click)="toggleSidebar()"
    class="absolute -left-3 top-10 w-6 h-6 bg-amber-600 rounded-full flex items-center justify-center text-white shadow-lg hover:bg-amber-500 transition-colors z-50">
    <span class="text-xs transition-transform duration-300" [class.rotate-180]="!isOpen">
      ▶
    </span>
  </button>

  <div *ngIf="isOpen" class="flex flex-col h-full overflow-hidden animate-fade-in">
    <div class="p-4 border-b border-zinc-800 flex justify-between items-center">
      <h3 class="text-white font-bold uppercase text-sm tracking-widest">Resumen Comanda</h3>
      <span class="bg-zinc-800 text-amber-500 text-[10px] px-2 py-1 rounded font-mono">ID: #842</span>
    </div>

    <div class="flex-1 overflow-y-auto p-4 space-y-4">
      <div class="flex justify-between items-start group">
        <div>
          <p class="text-white text-sm font-medium">Pizza Margarita</p>
          <p class="text-zinc-500 text-xs">Sin cebolla</p>
        </div>
        <span class="text-white text-sm font-bold">12,50€</span>
      </div>
    </div>

    <div class="p-4 bg-zinc-800/50 border-t border-zinc-800">
      <div class="flex justify-between text-zinc-400 mb-2">
        <span class="text-xs">Subtotal</span>
        <span class="text-xs">12,50€</span>
      </div>
      <div class="flex justify-between text-white font-bold text-xl mb-4">
        <span>Total</span>
        <span>12,50€</span>
      </div>
      <button class="w-full py-3 bg-amber-600 hover:bg-amber-500 text-white rounded-xl font-bold transition-all">
        Confirmar Pedido
      </button>
    </div>
  </div>

  <div *ngIf="!isOpen" class="flex flex-col items-center pt-20 gap-8 text-zinc-600 cursor-pointer"
    (click)="toggleSidebar()">
    <span class="text-xl">🛒</span>
    <div class="rotate-90 origin-center whitespace-nowrap font-bold text-xs uppercase tracking-[0.2em]">
      Ver Ticket
    </div>
  </div>

</aside>
